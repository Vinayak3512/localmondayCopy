<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>This is HCL Training</h1>
    <script>
        let a=parseString(prompt("Enter your name"));
        let b=parseInt(prompt("Enter your age"));
    </script>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
            </tr>
            <tr>
                <td><script>document.write(a)</script></td>
                <td><script>document.write(b)</script></td>
            </tr>
        </thead>
    </table>
</body>
</html>
